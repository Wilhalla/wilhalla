# One pnpm workspace for every JavaScript/TypeScript package in the monorepo.
packages:
  - apps/*
  - packages/*

# Supply-chain hardening: refuse versions that lost their provenance, and wait a day before
# installing freshly published versions.
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'reselect@5.1.1'
  - 'semver@6.3.1'
  - 'chokidar@4.0.3'
minimumReleaseAge: 1440

# CI and `just setup` install explicitly; never install implicitly before `pnpm run`.
verifyDepsBeforeRun: false

# Packages allowed to run install scripts.
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  msw: false
  sharp: false

overrides:
  # site: TanStack Start's server core is held back until the router packages catch up.
  '@tanstack/start-server-core': 1.169.45
  # Astro 7 typechecking on Node 24 needs the stable emnapi runtime in 0.1.4.
  '@astrojs/astro2tsx': 0.1.4
  # @vercel/routing-utils pins an affected patch despite accepting the compatible fix.
  '@vercel/routing-utils>path-to-regexp': 6.3.0
  # The Vercel OIDC chain accepts this patched Zod 4 release.
  'zod': 4.6.7

# Every external version used by any app lives here, once; packages declare `"react": "catalog:"`.
# Upgrading a version here upgrades every app that uses it. Exact pins are deliberate.
catalog:
  '@babel/core': ^7.29.13
  '@astrojs/check': ^0.9.12
  '@astrojs/react': ^7.1.8
  # 11.0.3 is the first patched release; later releases are currently rejected by
  # pnpm's provenance policy because their transitive @vercel/functions version
  # has weaker publisher evidence.
  '@astrojs/vercel': 11.0.3
  '@content-collections/core': ^0.15.3
  '@content-collections/markdown': ^0.1.4
  '@content-collections/vite': ^0.3.1
  '@fontsource-variable/eb-garamond': ^5.3.0
  '@fontsource-variable/geist-mono': ^5.3.0
  '@fontsource-variable/inter': ^5.3.0
  '@lucide/astro': ^1.72.0
  '@rolldown/plugin-babel': ^0.3.1
  '@shadcn/lint': ^0.2.5
  '@tailwindcss/vite': ^4.3.5
  '@tanstack/devtools-vite': ^0.8.6
  '@tanstack/react-devtools': ^0.10.14
  '@tanstack/react-query': ^5.107.1
  '@tanstack/react-router': 1.170.46
  '@tanstack/react-router-devtools': 1.167.3
  '@tanstack/react-start': 1.169.5
  # The fruit archive uses the v8 table API; migrate it before taking the v9 major.
  '@tanstack/react-table': ^8.21.3
  '@tanstack/react-virtual': ^3.14.26
  '@tanstack/router-core': 1.171.39
  '@testing-library/dom': ^10.4.2
  '@testing-library/react': ^16.3.3
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vercel/analytics': ^2.0.1
  '@vitejs/plugin-react': ^6.3.0
  'astro': ^7.4.11
  'babel-plugin-react-compiler': ^1.0.0
  'cheerio': ^1.2.0
  'domhandler': ^6.0.1
  'class-variance-authority': ^0.7.1
  'clsx': ^2.1.1
  'cmdk': ^1.1.1
  'jsdom': ^31.0.0
  'lucide-react': ^1.72.0
  'mermaid': ^12.3.0
  'minisearch': ^7.2.0
  'nitro': 3.0.261103-rc
  'radix-ui': ^1.8.1
  'react': ^19.3.1
  'react-dom': ^19.3.1
  'recharts': 3.10.1
  'shadcn': ^4.23.0
  'sharp': ^0.35.5
  'tailwind-merge': ^3.7.0
  'tailwindcss': ^4.3.5
  'tsx': ^4.23.15
  'tw-animate-css': ^1.4.0
  # Astro's checker and Volar integration do not yet support TypeScript 7.
  'typescript': ^6.0.3
  'vite': ^8.3.8
  'vitest': ^5.1.0
  'zod': ^4.6.7
