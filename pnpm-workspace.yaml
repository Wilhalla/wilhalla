# One pnpm workspace for every JavaScript/TypeScript package in the monorepo.
packages:
  - apps/*
  - packages/*

# Supply-chain hardening: refuse versions that lost their provenance, and wait a day before
# installing freshly published versions.
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'reselect@5.1.1'
  - 'semver@6.3.1'
  - 'chokidar@4.0.3'
minimumReleaseAge: 1440

# CI and `just setup` install explicitly; never install implicitly before `pnpm run`.
verifyDepsBeforeRun: false

# Packages allowed to run install scripts.
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  msw: false
  sharp: false

overrides:
  # site: TanStack Start's server core is held back until the router packages catch up.
  '@tanstack/start-server-core': 1.169.8

# Every external version used by any app lives here, once; packages declare `"react": "catalog:"`.
# Upgrading a version here upgrades every app that uses it. Exact pins are deliberate.
catalog:
  '@astrojs/check': ^0.9.12
  '@astrojs/react': ^5.0.7
  '@astrojs/vercel': ^10.0.8
  '@content-collections/core': ^0.15.2
  '@content-collections/markdown': ^0.1.4
  '@content-collections/vite': ^0.3.0
  '@fontsource-variable/eb-garamond': ^5.3.0
  '@fontsource-variable/geist-mono': ^5.3.0
  '@fontsource-variable/inter': ^5.3.0
  '@lucide/astro': ^1.61.0
  '@shadcn/lint': ^0.2.3
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/devtools-vite': ^0.7.2
  '@tanstack/react-devtools': ^0.10.8
  '@tanstack/react-query': ^5.101.2
  '@tanstack/react-router': 1.170.10
  '@tanstack/react-router-devtools': 1.167.0
  '@tanstack/react-start': 1.168.18
  '@tanstack/react-table': ^8.21.3
  '@tanstack/react-virtual': ^3.14.22
  '@tanstack/router-core': 1.171.8
  '@testing-library/dom': ^10.4.1
  '@testing-library/react': ^16.3.2
  '@types/node': ^25.9.9
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vercel/analytics': ^2.0.1
  '@vitejs/plugin-react': ^6.0.3
  'agentation': ^3.1.2
  'astro': ^6.4.8
  'babel-plugin-react-compiler': ^1.0.0
  'cheerio': ^1.2.0
  'class-variance-authority': ^0.7.1
  'clsx': ^2.1.1
  'cmdk': ^1.1.1
  'jsdom': ^29.1.1
  'lucide-react': ^1.61.0
  'mermaid': ^11.17.2
  'minisearch': ^7.2.0
  'nitro': 3.0.260522-beta
  'radix-ui': ^1.8.1
  'react': ^19.3.1
  'react-dom': ^19.3.1
  'recharts': 3.8.0
  'shadcn': ^4.22.1
  'sharp': ^0.34.5
  'tailwind-merge': ^3.7.0
  'tailwindcss': ^4.3.3
  'tsx': ^4.23.15
  'tw-animate-css': ^1.4.0
